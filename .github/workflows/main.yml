          std::vector<std::string> tokenize(const std::string& text) {
              std::vector<std::string> toks; std::string cur;
              auto flush = [&] { if (!cur.empty()) { toks.push_back(cur); cur.clear(); } };
              for (CodePoint cp : utf8Decode(text)) {
                  CharClass c = classify(cp);
                  if (c == CharClass::Space) { flush(); continue; }
                  bool punct = c == CharClass::Danda || cp == U',' || cp == U':' || cp == U';' || cp == U'?' || cp == U'!' || cp == U'.' || cp == U'"' || cp == U'(' || cp == U')';
                  if (punct) { flush(); toks.push_back(utf8Encode(cp)); } else cur += utf8Encode(cp);
              }
              flush(); return toks;
          }

          std::string joinTokens(const std::vector<std::string>& toks) {
              std::string out;
              for (const auto& t : toks) {
                  bool noSpaceBefore = (t == "।" || t == "," || t == ":" || t == "?" || t == "!" || t == ";");
                  if (!out.empty() && !noSpaceBefore) out += ' ';
                  out += t;
              }
              return out;
          }

          std::vector<std::string> splitLines(const std::string& s) {
              std::vector<std::string> out; std::istringstream is(s); std::string line;
              while (std::getline(is, line)) out.push_back(trim(line));
              return out;
          }

          class NGramModel {
          public:
              static constexpr int kOrder = 3;
              static constexpr double kLambda[kOrder] = {0.10, 0.30, 0.60};
              static inline const std::string BOS = "<s>";
              static inline const std::string EOS = "</s>";

              void trainSentence(const std::vector<std::string>& tokens) {
                  std::vector<std::string> seq = {BOS, BOS};
                  seq.insert(seq.end(), tokens.begin(), tokens.end());
                  seq.push_back(EOS);
                  for (std::size_t i = 2; i < seq.size(); ++i) {
                      for (int order = 0; order < kOrder; ++order) {
                          auto first = seq.begin() + static_cast<std::ptrdiff_t>(i - order);
                          auto last = seq.begin() + static_cast<std::ptrdiff_t>(i);
                          std::vector<std::string> ctx(first, last);
                          counts_[static_cast<std::size_t>(order)][ctx][seq[i]] += 1;
                      }
                      vocab_.insert(seq[i]);
                  }
              }

              std::map<std::string, double> distribution(const std::vector<std::string>& hist) const {
                  std::map<std::string, double> dist; double weightUsed = 0.0;
                  for (int order = 0; order < kOrder; ++order) {
                      if (hist.size() < static_cast<std::size_t>(order)) continue;
                      std::vector<std::string> ctx(hist.end() - static_cast<std::ptrdiff_t>(order), hist.end());
                      auto it = counts_[static_cast<std::size_t>(order)].find(ctx);
                      if (it == counts_[static_cast<std::size_t>(order)].end()) continue;
                      double total = 0.0; for (const auto& kv : it->second) total += kv.second;
                      for (const auto& kv : it->second) dist[kv.first] += kLambda[order] * static_cast<double>(kv.second) / total;
                      weightUsed += kLambda[order];
                  }
                  if (weightUsed > 0.0) for (auto& kv : dist) kv.second /= weightUsed;
                  return dist;
              }

              std::vector<std::string> generate(const std::vector<std::string>& prompt, int maxTokens, double temperature, std::mt19937& rng, int minTokens = 4) const {
                  std::vector<std::string> hist = {BOS, BOS};
                  hist.insert(hist.end(), prompt.begin(), prompt.end());
                  std::vector<std::string> out;
                  for (int step = 0; step < maxTokens; ++step) {
                      auto dist = distribution(hist);
                      std::vector<std::pair<std::string, double>> cand; double total = 0.0;
                      for (const auto& [word, prob] : dist) {
                          if (word == BOS) continue;
                          double w = std::pow(prob, 1.0 / temperature);
                          std::size_t from = out.size() > 6 ? out.size() - 6 : 0;
                          for (std::size_t k = from; k < out.size(); ++k) { if (out[k] == word) { w *= 0.35; break; } }
                          cand.emplace_back(word, w); total += w;
                      }
                      if (cand.empty() || total <= 0.0) break;
                      std::uniform_real_distribution<double> U(0.0, total);
                      double r = U(rng); double acc = 0.0; std::string pick = cand.back().first;
                      for (const auto& [word, w] : cand) { acc += w; if (r <= acc) { pick = word; break; } }
                      if (pick == EOS) break;
                      out.push_back(pick); hist.push_back(pick);
                      if (pick == "।" && static_cast<int>(out.size()) >= minTokens) break;
                  }
                  return out;
              }

              std::size_t vocabSize() const { return vocab_.size(); }

          private:
              std::array<std::map<std::vector<std::string>, std::map<std::string, int>>, kOrder> counts_;
              std::set<std::string> vocab_;
          };

          struct QAPair { std::vector<std::string> keywords; std::string answer; };

          class KnowledgeBase {
          public:
              KnowledgeBase() {
                  items_.push_back({{"नमस्ते", "नमस्कार", "हैलो", "सलाम"}, "नमस्ते! मैं Z+2AI हूँ। आप मुझसे कहानी सुन सकते हैं, कोई संख्या शब्दों में पूछ सकते हैं या हिंदी से जुड़े सवाल कर सकते हैं।"});
                  items_.push_back({{"नाम"}, "मेरा नाम Z+2AI है। मुझे ज़ीशान ने शून्य से डिज़ाइन और विकसित किया है।"});
                  items_.push_back({{"किसने", "बनाया", "बनाई", "रचयिता", "निर्माता", "मालिक", "क्रिएटर", "ज़ीशान", "जीशान"}, "मुझे ज़ीशान ने बनाया है। वे मेरे क्रिएटर, डेवलपर और मालिक हैं, और मेरी पूरी आर्किटेक्चर उन्होंने ही तैयार की है।"});
                  items_.push_back({{"उद्देश्य", "मकसद", "क्यों बने", "क्यों बनाया"}, "मेरा मुख्य उद्देश्य शुद्ध हिंदी में टेक्स्ट समझना और रचना करना, डेटा का विश्लेषण करना, और पूरी तरह ऑफ़लाइन रहकर कहानियाँ व उत्तर देना है।"});
                  items_.push_back({{"हिंदी", "हिन्दी"}, "हाँ, मैं शुद्ध हिंदी में बात कर सकता हूँ। मेरा व्याकरण कर्ता-कर्म-क्रिया (SOV) क्रम पर आधारित है, और मैं अक्षरों, मात्राओं और हलंत को पहचानता हूँ।"});
                  items_.push_back({{"ऑफ़लाइन", "ऑफलाइन", "offline", "इंटरनेट"}, "हाँ, मैं पूरी तरह ऑफ़लाइन चलता हूँ। मेरा सारा ज्ञान इसी प्रोग्राम के भीतर है, मुझे इंटरनेट की ज़रूरत नहीं।"});
                  items_.push_back({{"क्या कर सकते", "क्षमता", "क्या कर लेते", "कौन-कौन"}, "मैं तीन चीज़ें अच्छे से कर सकता हूँ: हिंदी अक्षरों और मात्राओं का विश्लेषण, किसी भी आकार की संख्या को हिंदी शब्दों में बदलना, और नई कहानियाँ गढ़ना। बाकी सवालों पर मैं अपने प्रशिक्षित हिंदी डेटा से उत्तर देता हूँ।"});
              }

              std::optional<std::string> answer(const std::string& query) const {
                  std::string q = toLowerAscii(query); int best = 0; const QAPair* hit = nullptr;
                  for (const auto& item : items_) {
                      int score = 0; for (const auto& kw : item.keywords) { if (q.find(kw) != std::string::npos) ++score; }
                      if (score > best) { best = score; hit = &item; }
                  }
                  if (hit) return hit->answer;
                  return std::nullopt;
              }

          private:
              std::vector<QAPair> items_;
          };

          template <typename T>
          T choose(const std::vector<T>& v, std::mt19937& rng) {
              std::uniform_int_distribution<std::size_t> d(0, v.size() - 1);
              return v[d(rng)];
          }

          class StoryWeaver {
          public:
              explicit StoryWeaver(const Lexicon& lex) : lex_(lex) {
                  pool(animals_, {"लोमड़ी", "कछुआ", "किसान", "लड़का", "लड़की", "बंदर", "शेर", "हाथी", "चिड़िया", "भालू"});
                  pool(places_, {"जंगल", "गाँव", "नदी", "पहाड़", "खेत", "पेड़"});
                  pool(adjectives_, {"भोला", "बड़ा", "छोटा", "अच्छा", "हरा", "सुंदर", "चालाक"});
                  pool(intransitive_, {"दौड़", "सो", "उठ", "जीत", "लड़"});
                  pairs_ = {{"सींच", "फसल"}, {"सींच", "पानी"}, {"खा", "रोटी"}, {"पढ़", "किताब"}, {"देख", "नदी"}, {"देख", "पहाड़"}, {"लिख", "किताब"}, {"समझ", "बात"}, {"पकड़", "कछुआ"}, {"बना", "रोटी"}};
              }

              std::string weave(std::mt19937& rng) const {
                  const LexEntry* hero = choose(animals_, rng);
                  const LexEntry* other = choose(animals_, rng);
                  while (other == hero) other = choose(animals_, rng);
                  const LexEntry* place = choose(places_, rng);
                  const LexEntry* adj = choose(adjectives_, rng);
                  const LexEntry* intr = choose(intransitive_, rng);
                  std::uniform_int_distribution<std::size_t> pd(0, pairs_.size() - 1);
                  const auto& pr = pairs_[pd(rng)];
                  const LexEntry* tVerb = lex_.find(pr.first);
                  const LexEntry* tObj = lex_.find(pr.second);
                  std::vector<std::string> lines;
                  grammar::Clause c1; c1.adverb = lex_.find("एक समय"); c1.subject = hero; c1.subjectAdj = adj; c1.locative = place; c1.verb = lex_.find("रह"); c1.tense = grammar::Tense::Present;
                  lines.push_back(grammar::renderClause(c1));
                  grammar::Clause c2; c2.adverb = lex_.find("सुबह"); c2.subject = other; c2.object = tObj; c2.verb = tVerb; c2.tense = grammar::Tense::Past;
                  lines.push_back(grammar::renderClause(c2));
                  grammar::Clause c3; c3.adverb = lex_.find("धीरे-धीरे"); c3.subject = hero; c3.verb = intr; c3.tense = grammar::Tense::Present;
                  lines.push_back(grammar::renderClause(c3));
                  grammar::Clause c4; c4.adverb = lex_.find("अचानक"); c4.subject = other; c4.verb = lex_.find("जीत"); c4.tense = grammar::Tense::Past;
                  lines.push_back(grammar::renderClause(c4));
                  static const std::vector<std::string> kMorals = {
                      "सच्ची जीत उसी की होती है जो हार नहीं मानता।",
                      "लगातार मेहनत करने वाला ही अंत में सफल होता है।",
                      "कभी भी किसी को कमजोर नहीं समझना चाहिए।",
                      "किस्मत भी उसी का साथ देती है जो कर्म करने से पीछे नहीं हटता।"
                  };
                  lines.push_back(choose(kMorals, rng));
                  std::string title = morph::adjective(adj->surface, hero->gender, Number::Singular) + " " + hero->surface + (hero->gender == Gender::Feminine ? " की कहानी" : " का किस्सा");
                  std::string body; for (const auto& l : lines) body += l + "\n";
                  return title + "\n\n" + body;
              }

          private:
              void pool(std::vector<const LexEntry*>& dst, const std::vector<std::string>& names) {
                  for (const auto& n : names) { if (const LexEntry* e = lex_.find(n)) dst.push_back(e); }
              }
              const Lexicon& lex_;
              std::vector<const LexEntry*> animals_, places_, adjectives_, intransitive_;
              std::vector<std::pair<std::string, std::string>> pairs_;
          };

          class Brain {
          public:
              Brain(const Lexicon& lex, const std::string& corpus) : weaver_(lex) {
                  for (const auto& line : splitLines(corpus)) {
                      if (line.empty() || line.front() == '[') continue;
                      auto toks = tokenize(line);
                      if (toks.empty()) continue;
                      model_.trainSentence(toks);
                      ++trainedSentences_; trainedTokens_ += toks.size();
                  }
              }

              std::string respond(const std::string& input, std::mt19937& rng) const {
                  std::string q = trim(input);
                  if (q.empty()) return "कृपया कुछ लिखिए।";
                  if (isNumericInput(q) || q.find("संख्या") != std::string::npos) return spellNumber(q);
                  if (q.find("कहानी") != std::string::npos) return weaver_.weave(rng);
                  if (auto known = kb_.answer(q)) return *known;
                  auto toks = tokenize(q); std::vector<std::string> prompt;
                  if (toks.size() >= 2) prompt.push_back(toks[toks.size() - 2]);
                  if (!toks.empty()) prompt.push_back(toks.back());
                  auto gen = model_.generate(prompt, 24, 0.75, rng);
                  if (gen.empty()) return "मैं इस विषय पर अभी सीख रहा हूँ। कृपया कहानी, संख्या या सामान्य सवाल पूछें।";
                  return joinTokens(gen);
              }

              std::string tellStory(std::mt19937& rng) const { return weaver_.weave(rng); }

          private:
              StoryWeaver weaver_;
              NGramModel model_;
              KnowledgeBase kb_;
              std::size_t trainedSentences_ = 0;
              std::size_t trainedTokens_ = 0;
          };

          } // namespace z2ai
          EOF

      - name: 13. Write JNI Native Bridge (`native-lib.cpp`)
        run: |
          echo "📝 Writing JNI Native Bridge: app/src/main/cpp/native-lib.cpp..."
          cat > app/src/main/cpp/native-lib.cpp <<'EOF'
          #include <jni.h>
          #include <string>
          #include <random>
          #include <chrono>
          #include <memory>
          #include "z2ai_brain.cpp"

          static z2ai::Lexicon g_lex;
          static std::unique_ptr<z2ai::Brain> g_brain;
          static std::mt19937 g_rng;

          extern "C" JNIEXPORT jstring JNICALL
          Java_com_zeeshan_ai_MainActivity_nativeGetAIResponse(JNIEnv* env, jobject /* this */, jstring query_) {
              const char* queryChars = env->GetStringUTFChars(query_, nullptr);
              std::string query(queryChars);
              env->ReleaseStringUTFChars(query_, queryChars);

              if (!g_brain) {
                  g_lex = z2ai::buildLexicon();
                  g_brain = std::make_unique<z2ai::Brain>(g_lex, z2ai::kCorpus);
                  g_rng.seed(static_cast<std::uint32_t>(std::chrono::steady_clock::now().time_since_epoch().count()));
              }

              std::string response = g_brain->respond(query, g_rng);
              return env->NewStringUTF(response.c_str());
          }
          EOF

